name: Deploy Karossy Foods to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the GitHub Pages site
        run: VITE_DEPLOY_TARGET=github-pages pnpm build
      - name: Keep managed media reachable from GitHub Pages
        run: |
          find dist/public -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -exec sed -i 's|/manus-storage/|https://karossyfood-kkj4va7e.manus.space/manus-storage/|g' {} +
          find dist/public -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -exec sed -i 's|https://karossyfood-kkj4va7e.manus.spacehttps://karossyfood-kkj4va7e.manus.space|https://karossyfood-kkj4va7e.manus.space|g' {} +
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
